# Extraction LLM providers (design v0.2 §6; model IDs verified live 2026-07-14).
# Keys always come from env vars (api_key_env) — this file is safe to commit.
# DB becomes the single source of truth after first seed import (KBase providers_store pattern).
active: qwen
providers:
  - name: qwen
    model: qwen3.7-plus
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
  - name: qwen-max            # strong tier for hard documents
    model: qwen3.7-max
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
  - name: gpt                 # cost-optimized tier; cheaper fallback: gpt-5.4-mini
    model: gpt-5.6-luna
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
  - name: deepseek
    model: deepseek-v4-pro
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
  - name: local-vllm          # air-gapped route
    model: Qwen3-VL-8B
    base_url: http://localhost:8000/v1
    api_key_env: ""
