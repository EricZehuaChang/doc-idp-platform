# Extraction LLM providers (design v0.2 §6; model IDs verified live 2026-07-14).
# Keys always come from env vars (api_key_env) — this file is safe to commit.
# DB becomes the single source of truth after first seed import (KBase providers_store pattern).
active: qwen
# platform-level fallback chain: studio tools (probe/text-draft/enrich) and any
# call without a skill-level binding fail over in order when channels are down.
# All keys live in D:/Claude Code/env/secrets.yaml (injected by run_dev.py).
fallback: [deepseek, gpt]
providers:
  - name: qwen
    model: qwen3.7-plus
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
    # Structured extraction needs deterministic JSON, not hidden reasoning.
    # On long invoice tables thinking can consume the entire read timeout.
    extra_body: {enable_thinking: false}
  - name: qwen-max            # strong tier for hard documents
    model: qwen3.7-max
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
    extra_body: {enable_thinking: false}
  - name: gpt                 # third-party OpenAI relay (aiyuhub); fallback tier
    model: gpt-5.6
    base_url: https://ai.aiyuhub.com/v1
    api_key_env: OPENAI_API_KEY
  - name: deepseek
    model: deepseek-v4-pro
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
  - name: local-vllm          # air-gapped route
    model: Qwen3-VL-8B
    base_url: http://localhost:8000/v1
    api_key_env: ""
  # —— vision channels (model ids verified live 2026-08-27 against each
  # vendor's /models plus a real image probe; the "flash" tier is the
  # multimodal one at Zhipu — glm-5.3 and glm-5 reject image content parts
  # outright with code 1210). These drive the vlm-* parsers in parsers.yaml.
  # Names are deliberately distinct from any console-registered channel so
  # provider resolution never has two answers for the same name.
  - name: vision-qwen
    model: qwen3-vl-plus
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
    extra_body: {enable_thinking: false}
  - name: vision-deepseek
    model: deepseek-v4-flash-vision-exp
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
  - name: vision-glm
    model: glm-5.3-flash
    base_url: https://open.bigmodel.cn/api/paas/v4
    api_key_env: ZHIPU_API_KEY
  # DeepSeek V4-Pro GA (2026-08-13): 1.6T-total / 49B-active MoE, native image
  # reasoning — the larger multimodal sibling of the flash-vision-exp channel
  # below. Added 2026-09-03 as an opt-in stronger tier; the flash channel stays.
  - name: vision-deepseek-pro
    model: deepseek-v4-pro
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
