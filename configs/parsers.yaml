# Parser plugins (design v0.2 §4.2 final decision 2026-07-14):
# local embedded OCR = GLM-OCR only; other vendors join as cloud APIs; MonkeyOCR kept as optional GPU parser.
parsers:
  - name: markitdown          # Office family -> Markdown (no bbox: acceptable, no page image concept)
    type: local
    for: electronic-office
  - name: pdfplumber          # electronic PDF text layer, bbox included (verification highlight)
    type: local
    for: electronic-pdf
  - name: glm-ocr-cloud       # Zhipu /layout_parsing, tested live: 1.6-12s, bbox+md (cloud-first for lite tier)
    type: cloud_api
    base_url: https://open.bigmodel.cn/api/paas/v4
    api_key_env: ZHIPU_API_KEY
  - name: ofd                 # OFD e-invoice/e-ticket: XBRL fast path -> text layer -> raster OCR fallback
    type: local
    for: ofd-eticket
  # Multimodal parsers (2026-08-27): page raster -> VLM -> Markdown. Pin-only,
  # auto-routing is untouched. They read layout a text-layer parser mangles
  # (merged cells, stamps over text, handwriting) but return NO bbox, so a
  # document parsed this way has nothing for verification highlight or the
  # masking channel to anchor to. Model behind each name is providers.yaml.
  # Measured 2026-08-27 on one A4 page (samples/insavlo/SO1_EA_1.pdf), all
  # three read the handwritten signatures the text layer cannot see:
  #   vlm-glm    ~63s  most faithful (kept both the PO number and the supplier)
  #   vlm-qwen   ~35s  fastest, dropped the supplier name
  #   vlm-deepseek ~283s(!) and mis-transcribed the company name — the model is
  #                 flagged -exp by the vendor; usable for trials, not for a
  #                 batch, and it can outrun the per-page timeout below.
  - name: vlm-qwen            # 千问 qwen3-vl-plus
    type: cloud_vlm
    provider: vision-qwen
  - name: vlm-deepseek        # DeepSeek deepseek-v4-flash-vision-exp（实验版，慢）
    type: cloud_vlm
    provider: vision-deepseek
  - name: vlm-glm             # 智谱 glm-5.3-flash
    type: cloud_vlm
    provider: vision-glm
  # M2: glm-ocr-local (vLLM + PP-DocLayoutV3), monkeyocr (optional, weights research-licensed), rapidocr (CPU fallback)
default_parser:
  lite: glm-ocr-cloud
  standard: glm-ocr-local
  air_gapped: glm-ocr-local
