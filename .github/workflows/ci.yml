name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: idp
          POSTGRES_PASSWORD: idp_dev_pw
          POSTGRES_DB: idp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U idp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # The opendataloader parser needs a real JVM (11+); without it the
      # real-PDF parse tests skip and CI would silently lose that coverage.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev,parsers,pg]"

      - name: Ruff
        run: ruff check app tests

      - name: Tests
        run: python -m pytest -q --durations=10
