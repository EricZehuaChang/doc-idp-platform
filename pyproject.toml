[project]
name = "doc-idp-platform"
version = "0.1.0"
description = "LLM-driven Intelligent Document Processing platform (design v0.2 final). M1 walking skeleton."
requires-python = ">=3.11"   # local dev floor; production images build on 3.12 (design v0.2 §9)
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",          # lite tier; PG via asyncpg in standard+ (design v0.2 §9.1)
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",  # file upload
]

[project.optional-dependencies]
parsers = [
    "markitdown>=0.1",   # Office family -> Markdown (design §4.2, MIT)
    "pdfplumber>=0.11",  # electronic PDF text layer with bbox (design §4.2, MIT; PyMuPDF is BANNED: AGPL)
]
pg = ["asyncpg>=0.29", "alembic>=1.13"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",       # mock LLM HTTP calls in tests (feasibility v2.0 §3.2)
    "ruff>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
