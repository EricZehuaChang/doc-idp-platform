[project]
name = "doc-idp-platform"
version = "0.1.0"
description = "LLM-driven Intelligent Document Processing platform (design v0.2 final). M1 walking skeleton."
requires-python = ">=3.11"   # local dev floor; production images build on 3.12 (design v0.2 §9)
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",             # schema migrations (docs/ALEMBIC.md; no runtime patching)
    "aiosqlite>=0.20",          # lite tier; PG via asyncpg in standard+ (design v0.2 §9.1)
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",  # file upload
    "pyjwt>=2.8",               # session JWT (§11.9; fork-and-own KBase pattern)
    "email-validator>=2.0",     # pydantic EmailStr on auth endpoints
    "celery[redis]>=5.4",       # pooled task queues (§9; Windows dev: -P threads)
    "aiosmtplib>=3.0",          # platform mailer (§11.8, async SMTP)
    "cryptography>=42",         # SMTP password encryption at rest (§11.8)
]

[project.optional-dependencies]
parsers = [
    # Office family -> Markdown (design §4.2, MIT).  The extras are the actual
    # format readers (docx=mammoth, xlsx=openpyxl, pptx=python-pptx): bare
    # `markitdown` imports fine but throws MissingDependencyException on every
    # Office file at runtime.  Found the hard way on the first clean install
    # (2026-08-11 production): the dev venv had accumulated these packages over
    # months, so the gap never showed locally — the docx semantic channel
    # silently degraded to regex-only on the server.
    "markitdown[docx,xlsx,pptx]>=0.1",
    "pdfplumber>=0.11",  # electronic PDF text layer with bbox (design §4.2, MIT; PyMuPDF is BANNED: AGPL)
    "pypdf>=5.0",        # physical PDF slicing for multi-doc split (BSD)
    # Electronic-PDF first pass: structured layout + cell-level bbox, zero
    # transitive deps (bundled JAR, needs a Java 11+ runtime; parser degrades
    # to pdfplumber without one). Pin 2.x: Apache-2.0 from 2.0 (pre-2.0 = MPL).
    "opendataloader-pdf>=2.5,<3",
]
# seal/signature visual detection (/detect channel, design 2026-08-07).
# Model weights are NOT pip-shipped: PP-DocLayoutV3-ONNX (261MB, Apache-2.0)
# goes to data/models/ — see configs/detectors.yaml model_source.
vision = [
    "onnxruntime>=1.17",   # MIT; CPU inference for the layout ONNX
    "pypdfium2>=4",        # PDFium (BSD/Apache-2.0); PDF rasterizer — fitz is BANNED (AGPL)
    "pillow>=10",          # HPND; image IO + HSV for the red-seal CV fallback
    "numpy>=1.26",         # pre/post-processing
]
pg = ["asyncpg>=0.29"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",       # mock LLM HTTP calls in tests (feasibility v2.0 §3.2)
    "ruff>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
