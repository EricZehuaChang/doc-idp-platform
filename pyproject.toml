[project]
name = "doc-idp-platform"
version = "0.1.0"
description = "LLM-driven Intelligent Document Processing platform (design v0.2 final). M1 walking skeleton."
requires-python = ">=3.11"   # local dev floor; production images build on 3.12 (design v0.2 §9)
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",          # lite tier; PG via asyncpg in standard+ (design v0.2 §9.1)
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",  # file upload
    "pyjwt>=2.8",               # session JWT (§11.9; fork-and-own KBase pattern)
    "email-validator>=2.0",     # pydantic EmailStr on auth endpoints
    "celery[redis]>=5.4",       # pooled task queues (§9; Windows dev: -P threads)
    "aiosmtplib>=3.0",          # platform mailer (§11.8, async SMTP)
    "cryptography>=42",         # SMTP password encryption at rest (§11.8)
]

[project.optional-dependencies]
parsers = [
    "markitdown>=0.1",   # Office family -> Markdown (design §4.2, MIT)
    "pdfplumber>=0.11",  # electronic PDF text layer with bbox (design §4.2, MIT; PyMuPDF is BANNED: AGPL)
    "pypdf>=5.0",        # physical PDF slicing for multi-doc split (BSD)
    # Electronic-PDF first pass: structured layout + cell-level bbox, zero
    # transitive deps (bundled JAR, needs a Java 11+ runtime; parser degrades
    # to pdfplumber without one). Pin 2.x: Apache-2.0 from 2.0 (pre-2.0 = MPL).
    "opendataloader-pdf>=2.5,<3",
]
pg = ["asyncpg>=0.29", "alembic>=1.13"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",       # mock LLM HTTP calls in tests (feasibility v2.0 §3.2)
    "ruff>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
